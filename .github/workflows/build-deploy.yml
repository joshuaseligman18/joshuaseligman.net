name: GitHub Pages Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://joshuaseligman.net
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Build website
        run: |
          mise run init
          mise run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - uses: actions/deploy-pages@v5
